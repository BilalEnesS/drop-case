name: CI

# When should this workflow run?
on:
  # Run on every push and pull request
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Also run on feature branches
  workflow_dispatch:

jobs:
  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code (download repository)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Install dependencies
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Run tests
      - name: Run tests
        working-directory: ./backend
        env:
          ENV: development
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: test-secret-key
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -v --tb=short --maxfail=1

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # 3. Install dependencies
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      # 4. Run tests
      - name: Run tests
        working-directory: ./frontend
        run: npm run test:ci -- --reporter=verbose
      
      # 5. (Optional) Build check
      - name: Build check
        working-directory: ./frontend
        run: npm run build

